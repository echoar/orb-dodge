<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orb Dodge">
  <meta name="theme-color" content="#080812">
  <title>Orb Dodge</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      background-color: #080812;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #top-ad-banner {
      width: 320px;
      height: 50px;
      min-height: 50px;
      background: #0d0d1a;
      border: 1px dashed rgba(80, 200, 255, 0.35);
      color: rgba(200, 220, 255, 0.6);
      font-size: 11px;
      display: flex;
      justify-content: center;
      align-items: center;
      letter-spacing: 0.5px;
      margin-top: 4px;
      margin-bottom: 2px;
      border-radius: 4px;
      z-index: 50;
      flex-shrink: 0;
    }
    #game-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    #interstitial-ad {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 5, 12, 0.95);
      z-index: 99999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }
    #interstitial-ad .ad-box {
      width: 300px;
      height: 250px;
      background: #121226;
      border: 1px solid #3c3c6e;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #8888b0;
      font-size: 13px;
      position: relative;
    }
    #interstitial-ad .close-btn {
      position: absolute;
      top: -36px;
      right: 0;
      background: #252545;
      color: #fff;
      border: 1px solid #4a4a75;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #error-box {
      display: none;
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(220, 20, 20, 0.95);
      color: white;
      padding: 10px;
      font-size: 11px;
      z-index: 9999;
      border-radius: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="error-box"></div>
  <div id="top-ad-banner">
    <span>[ AdMob Test Banner | 320x50 ]</span>
  </div>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="interstitial-ad">
      <div class="ad-box">
        <button class="close-btn" onclick="closeInterstitial()">✕ Close [3s]</button>
        <div style="font-weight:bold; color:#00e5ff; margin-bottom:8px;">AdMob Test Interstitial</div>
        <div>(Frequency cap: 1 per 3 deaths)</div>
      </div>
    </div>
  </div>

  <script>
    // iOS Safari gesture prevention
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

    
    function showInterstitial() {
      STATE.deathCount++;
      if (STATE.deathCount % 3 === 0) {
        const ad = document.getElementById('interstitial-ad');
        if (ad) ad.style.display = 'flex';
      }
    }
    function closeInterstitial() {
      const ad = document.getElementById('interstitial-ad');
      if (ad) ad.style.display = 'none';
    }

    window.onerror = function(msg, url, line) {
      const box = document.getElementById('error-box');
      if (box) {
        box.style.display = 'block';
        box.innerText = 'Error: ' + msg + ' (L' + line + ')';
      }
      return false;
    };

    function getStoredHS() {
      try {
        return parseInt(localStorage.getItem('orb_dodge_hs') || '0', 10) || 0;
      } catch (e) {
        return 0;
      }
    }
    function saveHS(val) {
      try {
        localStorage.setItem('orb_dodge_hs', val);
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const V_WIDTH = 400;
    const V_HEIGHT = 711;

    let viewScale = 1.0;
    let canvasRect = { left: 0, top: 0, width: V_WIDTH, height: V_HEIGHT };

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

      viewScale = Math.min(w / V_WIDTH, h / V_HEIGHT);
      const displayW = Math.floor(V_WIDTH * viewScale);
      const displayH = Math.floor(V_HEIGHT * viewScale);

      canvas.style.width = displayW + 'px';
      canvas.style.height = displayH + 'px';
      canvas.width = Math.floor(displayW * dpr);
      canvas.height = Math.floor(displayH * dpr);

      canvasRect = canvas.getBoundingClientRect();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function() { setTimeout(resize, 200); });
    resize();

    const STATE = {
      controlMode: 'shmove', // 'shmove' (relative drag + momentum) or 'direct'
      vx: 0,
      vy: 0,
      plasmaActive: 0,
      plasmaAngle: 0,
      teslaArcs: [],
      nukeRing: 0,
      nukePos: null,
      deathCount: 0,
      prevLaserAngle: 0,
      px: V_WIDTH / 2,
      py: V_HEIGHT / 2,
      tx: V_WIDTH / 2,
      ty: V_HEIGHT / 2,
      touching: false,
      alive: true,
      score: 0,
      highScore: getStoredHS(),
      wave: 0,
      waveTimer: 1.0,
      powerupTimer: 2.8,
      combo: 0,
      comboTimer: 0,
      dashing: false,
      dashDir: { x: 0, y: -1 },
      dashFrames: 0,
      dashCd: 0,
      invincibleFrames: 0,
      shieldActive: 0,
      shieldCd: 0,
      zoneMargin: 0,
      shockwaveRing: 0,
      shockwavePos: null,
      vortexActive: 0,
      vortexPos: null,
      iceSlowFrames: 0,
      laserActive: 0,
      laserAngle: 0,
      deathTimer: 0
    };

    const PR = 14;
    const LERP = 16.0;
    const TRAIL_MAX = 55;
    const TRAIL_DMG = 1;
    const DASH_DIST = 130;
    const DASH_SPD = 26;
    const SHIELD_R = 105;

    let trail = [];
    let enemies = [];
    let powerups = [];
    let particles = [];

    const ENEMY_COLORS = ['#ff3c3c', '#ff6428', '#ff3250', '#dc2828'];
    const PU_COLORS = {
      nuke: '#ff4400',
      laser: '#32ff64',
      tesla: '#00e5ff',
      plasma: '#ff00aa',
      shockwave: '#ffdc32',
      vortex: '#b432ff',
      ice_nova: '#64dcff'
    };

    function reset() {
      STATE.px = V_WIDTH / 2;
      STATE.py = V_HEIGHT / 2;
      STATE.tx = STATE.px;
      STATE.ty = STATE.py;
      STATE.touching = false;
      STATE.alive = true;
      STATE.score = 0;
      STATE.wave = 0;
      STATE.waveTimer = 1.0;
      STATE.powerupTimer = 4.0;
      STATE.combo = 0;
      STATE.comboTimer = 0;
      STATE.dashing = false;
      STATE.dashFrames = 0;
      STATE.dashCd = 0;
      STATE.invincibleFrames = 0;
      STATE.shieldActive = 0;
      STATE.shieldCd = 0;
      STATE.zoneMargin = 0;
      STATE.shockwaveRing = 0;
      STATE.shockwavePos = null;
      STATE.vortexActive = 0;
      STATE.vortexPos = null;
      STATE.iceSlowFrames = 0;
      STATE.laserActive = 0;
      STATE.deathTimer = 0;

      trail = [];
      enemies = [];
      powerups = [];
      particles = [];
    }

    function spawnWave() {
      STATE.wave++;
      const count = 5 + STATE.wave * 2;
      const speed = 1.2 + STATE.wave * 0.025;
      STATE.zoneMargin = Math.min(55, STATE.wave * 3.5);

      for (let i = 0; i < count; i++) {
        const side = Math.floor(Math.random() * 4);
        let x, y;
        const M = 30;
        if (side === 0) { x = Math.random() * V_WIDTH; y = -M; }
        else if (side === 1) { x = Math.random() * V_WIDTH; y = V_HEIGHT + M; }
        else if (side === 2) { x = -M; y = Math.random() * V_HEIGHT; }
        else { x = V_WIDTH + M; y = Math.random() * V_HEIGHT; }

        enemies.push({
          x, y,
          speed: speed * (0.75 + Math.random() * 0.5),
          radius: 10,
          hp: 1,
          color: ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)],
          flash: 0
        });
      }
    }

    function spawnPowerup() {
      const m = STATE.zoneMargin + 40;
      const kinds = Object.keys(PU_COLORS);
      powerups.push({
        x: m + Math.random() * (V_WIDTH - 2 * m),
        y: m + 50 + Math.random() * (V_HEIGHT - 2 * m - 80),
        kind: kinds[Math.floor(Math.random() * kinds.length)],
        radius: 12,
        pulse: Math.random() * Math.PI
      });
    }

    function spawnParticles(x, y, color, count, speed) {
      count = count || 12;
      speed = speed || 4;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * speed;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 15 + Math.random() * 20,
          maxLife: 35,
          color,
          radius: 2 + Math.random() * 3
        });
      }
    }

        function activatePowerup(kind) {
      STATE.combo++;
      STATE.comboTimer = 2.4;
      const mul = Math.min(STATE.combo, 3.5);

      if (kind === 'nuke') {
        // Layer 1: Massive expanding blast ring
        STATE.nukeRing = 1;
        STATE.nukePos = { x: STATE.px, y: STATE.py };
        // Layer 2: Screen flash + wipe all enemies + radial shrapnel
        enemies.forEach(function(e) {
          spawnParticles(e.x, e.y, '#ff4400', 10, 7);
          STATE.score += 15;
        });
        enemies = [];
        spawnParticles(STATE.px, STATE.py, '#ffffff', 40, 10);
      } else if (kind === 'tesla') {
        // Layer 1: Chain lightning arcs between clustered enemies
        STATE.teslaArcs = [];
        const hit = enemies.slice(0, 10);
        let prev = { x: STATE.px, y: STATE.py };
        hit.forEach(function(e) {
          STATE.teslaArcs.push({ x1: prev.x, y1: prev.y, x2: e.x, y2: e.y, life: 18 });
          prev = { x: e.x, y: e.y };
          // Layer 2: Electric sizzle spark burst
          spawnParticles(e.x, e.y, '#00e5ff', 8, 5);
          e.hp = 0;
          STATE.score += 10;
        });
        spawnParticles(STATE.px, STATE.py, '#00e5ff', 20, 6);
      } else if (kind === 'plasma') {
        // Layer 1: 3 Orbiting sawblades around player for 6 seconds
        STATE.plasmaActive = 360 * mul;
        spawnParticles(STATE.px, STATE.py, '#ff00aa', 25, 6);
      } else if (kind === 'laser') {
        // Layer 1: Telegraph vector guide + Layer 2: Blinding 850px cutting beam
        STATE.laserActive = 75 * mul;
        STATE.laserAngle = Math.atan2(STATE.ty - STATE.py, STATE.tx - STATE.px) || 0;
        STATE.prevLaserAngle = STATE.laserAngle;
        spawnParticles(STATE.px, STATE.py, '#32ff64', 20, 8);
      } else if (kind === 'shockwave') {
        STATE.shockwaveRing = 1;
        STATE.shockwavePos = { x: STATE.px, y: STATE.py };
        const r = 135 * mul;
        enemies = enemies.filter(function(e) {
          const d = Math.hypot(e.x - STATE.px, e.y - STATE.py);
          if (d < r) {
            spawnParticles(e.x, e.y, e.color, 8, 5);
            STATE.score += 10;
            return false;
          }
          return true;
        });
        spawnParticles(STATE.px, STATE.py, '#ffdc32', 26, 7);
      } else if (kind === 'vortex') {
        STATE.vortexActive = 100 * mul;
        STATE.vortexPos = { x: STATE.px, y: STATE.py };
      } else if (kind === 'ice_nova') {
        STATE.iceSlowFrames = 140 * mul;
        spawnParticles(STATE.px, STATE.py, '#64dcff', 26, 6);
        enemies.forEach(function(e) { e.speed *= 0.35; });
      }
    }

    let swipeStart = null;
    let swipeStartTime = 0;

    const FINGER_OFFSET_Y = 85; // Strict Zendoku offset: orb hovers 85px above finger
    let rawTouchPos = null;

    function getTouchCoords(clientX, clientY) {
      canvasRect = canvas.getBoundingClientRect();
      const rawX = ((clientX - canvasRect.left) / canvasRect.width) * V_WIDTH;
      const rawY = ((clientY - canvasRect.top) / canvasRect.height) * V_HEIGHT;
      rawTouchPos = { x: Math.max(0, Math.min(V_WIDTH, rawX)), y: Math.max(0, Math.min(V_HEIGHT, rawY)) };
      return {
        x: rawTouchPos.x,
        y: Math.max(20, Math.min(V_HEIGHT - 20, rawTouchPos.y - FINGER_OFFSET_Y))
      };
    }

    let lastTouchX = 0;
    let lastTouchY = 0;
    let lastMoveTime = 0;

    function onStart(cx, cy) {
      canvasRect = canvas.getBoundingClientRect();
      const rawX = ((cx - canvasRect.left) / canvasRect.width) * V_WIDTH;
      const rawY = ((cy - canvasRect.top) / canvasRect.height) * V_HEIGHT;

      if (!STATE.alive && STATE.deathTimer > 0.4) {
        reset();
        return;
      }

      STATE.touching = true;
      lastTouchX = rawX;
      lastTouchY = rawY;
      lastMoveTime = performance.now();
      rawTouchPos = { x: rawX, y: rawY };

      // Base offset: ensure orb is at least 85px above finger on initial touch
      STATE.tx = STATE.px;
      STATE.ty = Math.min(STATE.py, rawY - FINGER_OFFSET_Y);

      swipeStart = { x: rawX, y: rawY };
      swipeStartTime = performance.now();
    }

    function onMove(cx, cy) {
      if (!STATE.touching) return;
      canvasRect = canvas.getBoundingClientRect();
      const rawX = ((cx - canvasRect.left) / canvasRect.width) * V_WIDTH;
      const rawY = ((cy - canvasRect.top) / canvasRect.height) * V_HEIGHT;
      const now = performance.now();
      const dt = Math.max(0.005, (now - lastMoveTime) / 1000);

      const dx = rawX - lastTouchX;
      const dy = rawY - lastTouchY;
      const dist = Math.hypot(dx, dy);
      const speed = dist / dt; // pixels per second

      // Dynamic acceleration curve:
      // Slow micro-movements (< 180 px/s): 1.0x precision
      // Fast flicks (> 180 px/s): non-linear ramp up to 3.5x distance
      let accel = 1.0;
      if (speed > 180) {
        accel = 1.0 + Math.min(2.5, Math.pow((speed - 180) / 450, 1.15));
      }

      STATE.tx += dx * accel;
      STATE.ty += dy * accel;

      // Clamp target within game zone
      const zm = STATE.zoneMargin;
      STATE.tx = Math.max(zm + PR, Math.min(V_WIDTH - zm - PR, STATE.tx));
      STATE.ty = Math.max(zm + PR + 45, Math.min(V_HEIGHT - zm - PR - 30, STATE.ty));

      lastTouchX = rawX;
      lastTouchY = rawY;
      lastMoveTime = now;
      rawTouchPos = { x: rawX, y: rawY };
    }

    function onEnd(cx, cy) {
      rawTouchPos = null;
      if (!STATE.touching) return;
      STATE.touching = false;
      const endPt = getTouchCoords(cx, cy);

      if (swipeStart) {
        const dx = endPt.x - swipeStart.x;
        const dy = endPt.y - swipeStart.y;
        const dist = Math.hypot(dx, dy);
        const elapsed = performance.now() - swipeStartTime;

        if (dist > 35 && elapsed < 350) {
          if (dy < -25 && Math.abs(dx) < Math.abs(dy) * 1.5 && STATE.dashCd <= 0) {
            const n = Math.hypot(dx, dy) || 1;
            STATE.dashDir = { x: dx / n, y: dy / n };
            STATE.dashing = true;
            STATE.dashFrames = Math.floor(DASH_DIST / DASH_SPD);
            STATE.dashCd = 1.4;
            STATE.invincibleFrames = 12;
            spawnParticles(STATE.px, STATE.py, '#50c8ff', 12, 4);
          } else if (dy > 25 && Math.abs(dx) < Math.abs(dy) * 1.5 && STATE.shieldCd <= 0) {
            STATE.shieldActive = 18;
            STATE.shieldCd = 2.8;
            spawnParticles(STATE.px, STATE.py, '#64c8ff', 16, 5);
            enemies.forEach(function(en) {
              const d = Math.hypot(en.x - STATE.px, en.y - STATE.py);
              if (d < SHIELD_R && d > 1) {
                en.x += ((en.x - STATE.px) / d) * 10;
                en.y += ((en.y - STATE.py) / d) * 10;
              }
            });
          }
        }
      }
      swipeStart = null;
    }

    // Touch event listeners
    window.addEventListener('touchstart', function(e) {
      e.preventDefault();
      if (e.touches.length > 0) onStart(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (e.touches.length > 0) onMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchend', function(e) {
      e.preventDefault();
      if (e.changedTouches.length > 0) onEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      else onEnd(STATE.tx, STATE.ty);
    }, { passive: false });

    // Mouse listeners for desktop testing
    window.addEventListener('mousedown', function(e) { onStart(e.clientX, e.clientY); });
    window.addEventListener('mousemove', function(e) { onMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', function(e) { onEnd(e.clientX, e.clientY); });

    let lastTime = performance.now();

    function update(dt) {
      if (!STATE.alive) {
        STATE.deathTimer += dt;
        return;
      }

      if (STATE.dashing) {
        STATE.px += STATE.dashDir.x * DASH_SPD;
        STATE.py += STATE.dashDir.y * DASH_SPD;
        STATE.dashFrames--;
        if (STATE.dashFrames <= 0) STATE.dashing = false;
      } else if (STATE.touching) {
        const dx = STATE.tx - STATE.px;
        const dy = STATE.ty - STATE.py;
        const dist = Math.hypot(dx, dy);
        if (dist > 0.5) {
          // Cap maximum speed so orb doesn't teleport into enemies on fast flicks
          const MAX_SPEED = 620; // max pixels per second
          const desiredStep = dist * Math.min(1.0, LERP * dt);
          const maxStep = MAX_SPEED * dt;
          const actualStep = Math.min(dist, Math.min(desiredStep, maxStep));
          STATE.px += (dx / dist) * actualStep;
          STATE.py += (dy / dist) * actualStep;
        }
      }

      const zm = STATE.zoneMargin;
      STATE.px = Math.max(zm + PR, Math.min(V_WIDTH - zm - PR, STATE.px));
      STATE.py = Math.max(zm + PR + 45, Math.min(V_HEIGHT - zm - PR - 30, STATE.py));

      if (STATE.dashCd > 0) STATE.dashCd -= dt;
      if (STATE.shieldCd > 0) STATE.shieldCd -= dt;
      if (STATE.invincibleFrames > 0) STATE.invincibleFrames--;
      if (STATE.shieldActive > 0) STATE.shieldActive--;
      if (STATE.comboTimer > 0) STATE.comboTimer -= dt;
      else STATE.combo = 0;

      trail.push({ x: STATE.px, y: STATE.py, alpha: 200 });
      if (trail.length > TRAIL_MAX) trail.shift();
      trail.forEach(function(t) { t.alpha -= 3.5; });
      trail = trail.filter(function(t) { return t.alpha > 0; });

      const iceFactor = STATE.iceSlowFrames > 0 ? 0.35 : 1.0;
      if (STATE.iceSlowFrames > 0) {
        STATE.iceSlowFrames--;
        if (STATE.iceSlowFrames === 0) enemies.forEach(function(e) { e.speed /= 0.35; });
      }

      enemies.forEach(function(e) {
        if (STATE.vortexActive > 0 && STATE.vortexPos) {
          const vdx = STATE.vortexPos.x - e.x;
          const vdy = STATE.vortexPos.y - e.y;
          const vd = Math.hypot(vdx, vdy);
          if (vd < 155 && vd > 1) {
            e.x += (vdx / vd) * 3.2;
            e.y += (vdy / vd) * 3.2;
            if (vd < 20) {
              spawnParticles(e.x, e.y, e.color, 5);
              e.hp = 0;
              STATE.score += 10;
            }
          }
        }

        const dx = STATE.px - e.x;
        const dy = STATE.py - e.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 1) {
          e.x += (dx / dist) * e.speed * dt * 60 * iceFactor;
          e.y += (dy / dist) * e.speed * dt * 60 * iceFactor;
        }

        for (let i = 0; i < trail.length; i++) {
          const t = trail[i];
          if (t.alpha > 45 && Math.hypot(t.x - e.x, t.y - e.y) < e.radius + 5) {
            e.hp -= TRAIL_DMG;
            e.flash = 4;
            t.alpha = 0;
            break;
          }
        }

        if (STATE.invincibleFrames <= 0 && STATE.shieldActive <= 0) {
          if (dist < PR + e.radius - 2) {
            STATE.alive = false;
            if (STATE.score > STATE.highScore) {
              STATE.highScore = Math.floor(STATE.score);
              saveHS(STATE.highScore);
            }
            showInterstitial();
            spawnParticles(STATE.px, STATE.py, '#50c8ff', 35, 9);
          }
        }
      });

      if (STATE.vortexActive > 0) STATE.vortexActive--;

      // 1. Full-screen Laser Collision (850px range, point-to-segment distance)
      if (STATE.laserActive > 0) {
        STATE.prevLaserAngle = STATE.laserAngle;
        STATE.laserAngle += 0.07;
        STATE.laserActive--;

        const lx = Math.cos(STATE.laserAngle);
        const ly = Math.sin(STATE.laserAngle);
        const BEAM_LEN = 850;

        enemies.forEach(function(e) {
          const ex = e.x - STATE.px;
          const ey = e.y - STATE.py;
          const proj = ex * lx + ey * ly;
          if (proj > 0 && proj < BEAM_LEN) {
            const perpDist = Math.abs(ex * (-ly) + ey * lx);
            if (perpDist < e.radius + 18) {
              e.hp = 0;
              spawnParticles(e.x, e.y, '#32ff64', 6, 4);
              STATE.score += 10;
            }
          }
        });
      }

      // 2. Plasma Orbiting Blades Collision
      if (STATE.plasmaActive > 0) {
        STATE.plasmaActive--;
        STATE.plasmaAngle += 0.09;
        const ORBIT_R = 68;
        for (let i = 0; i < 3; i++) {
          const a = STATE.plasmaAngle + (i * Math.PI * 2 / 3);
          const bx = STATE.px + Math.cos(a) * ORBIT_R;
          const by = STATE.py + Math.sin(a) * ORBIT_R;
          enemies.forEach(function(e) {
            if (Math.hypot(e.x - bx, e.y - by) < e.radius + 14) {
              e.hp = 0;
              spawnParticles(e.x, e.y, '#ff00aa', 6, 5);
              STATE.score += 10;
            }
          });
        }
      }

      // 3. Tesla arc decay
      if (STATE.teslaArcs && STATE.teslaArcs.length > 0) {
        STATE.teslaArcs.forEach(function(a) { a.life--; });
        STATE.teslaArcs = STATE.teslaArcs.filter(function(a) { return a.life > 0; });
      }

      // 4. Nuke Shockwave Expansion
      if (STATE.nukeRing > 0) {
        STATE.nukeRing += 14;
        if (STATE.nukeRing > 550) STATE.nukeRing = 0;
      }

      enemies = enemies.filter(function(e) { return e.hp > 0; });

      STATE.powerupTimer -= dt;
      if (STATE.powerupTimer <= 0) {
        spawnPowerup();
        STATE.powerupTimer = 2.8;
      }
      powerups = powerups.filter(function(p) {
        if (Math.hypot(p.x - STATE.px, p.y - STATE.py) < PR + p.radius) {
          activatePowerup(p.kind);
          return false;
        }
        return true;
      });

      if (enemies.length === 0) {
        STATE.waveTimer -= dt;
        if (STATE.waveTimer <= 0) {
          spawnWave();
          STATE.waveTimer = 2.0;
        }
      }

      if (STATE.shockwaveRing > 0) {
        STATE.shockwaveRing += 8;
        if (STATE.shockwaveRing > 220) STATE.shockwaveRing = 0;
      }

      particles.forEach(function(p) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life--;
        p.radius *= 0.97;
      });
      particles = particles.filter(function(p) { return p.life > 0 && p.radius > 0.4; });

      STATE.score += dt * 3;
    }

        function drawPowerupIcon(ctx, kind, x, y, r) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = '#ffffff';
      ctx.fillStyle = '#ffffff';
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const s = r * 0.55; // scale

      if (kind === 'nuke') {
        // Biohazard / Radiation trefoil symbol
        ctx.beginPath();
        ctx.arc(0, 0, 2, 0, Math.PI * 2);
        ctx.fill();
        for (let i = 0; i < 3; i++) {
          const a = (i * Math.PI * 2 / 3) - Math.PI / 2;
          ctx.beginPath();
          ctx.arc(0, 0, s * 0.95, a - 0.35, a + 0.35);
          ctx.stroke();
        }
      } else if (kind === 'laser') {
        // Piercing laser beam with targeting crosshair
        ctx.beginPath();
        ctx.moveTo(-s, 0); ctx.lineTo(s, 0);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.5); ctx.lineTo(0, s * 0.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 1.8, 0, Math.PI * 2);
        ctx.fill();
      } else if (kind === 'tesla') {
        // Geometric lightning bolt
        ctx.beginPath();
        ctx.moveTo(1, -s);
        ctx.lineTo(-s * 0.5, 0);
        ctx.lineTo(1, 0);
        ctx.lineTo(-1, s);
        ctx.lineTo(s * 0.6, -1);
        ctx.lineTo(1, -1);
        ctx.closePath();
        ctx.fill();
      } else if (kind === 'plasma') {
        // 3-blade rotating shuriken
        const t = performance.now() / 400;
        for (let i = 0; i < 3; i++) {
          const a = t + (i * Math.PI * 2 / 3);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s);
          ctx.lineTo(Math.cos(a + 0.4) * (s * 0.5), Math.sin(a + 0.4) * (s * 0.5));
          ctx.closePath();
          ctx.fill();
        }
      } else if (kind === 'shockwave') {
        // Concentric pulse waves
        ctx.beginPath();
        ctx.arc(0, 0, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.55, -Math.PI * 0.6, Math.PI * 0.6);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.55, Math.PI * 0.4, Math.PI * 1.6);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.95, -Math.PI * 0.4, Math.PI * 0.4);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.95, Math.PI * 0.6, Math.PI * 1.4);
        ctx.stroke();
      } else if (kind === 'vortex') {
        // Spiral / Swirl vortex
        ctx.beginPath();
        for (let a = 0; a < Math.PI * 3.5; a += 0.2) {
          const rad = (a / (Math.PI * 3.5)) * s * 0.9;
          const px = Math.cos(a) * rad;
          const py = Math.sin(a) * rad;
          if (a === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      } else if (kind === 'ice_nova') {
        // Crisp 6-branch snowflake
        for (let i = 0; i < 3; i++) {
          const a = i * Math.PI / 3;
          ctx.beginPath();
          ctx.moveTo(-Math.cos(a) * s, -Math.sin(a) * s);
          ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(0, 0, 1.8, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.5, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

function draw() {
      const scale = (canvas.width / V_WIDTH);

      ctx.save();
      ctx.setTransform(scale, 0, 0, scale, 0, 0);

      ctx.fillStyle = '#080812';
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      const zm = STATE.zoneMargin;
      ctx.strokeStyle = '#121223';
      ctx.lineWidth = 1;
      for (let x = zm; x < V_WIDTH - zm; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, zm + 45);
        ctx.lineTo(x, V_HEIGHT - zm - 30);
        ctx.stroke();
      }
      for (let y = zm + 45; y < V_HEIGHT - zm - 30; y += 30) {
        ctx.beginPath();
        ctx.moveTo(zm, y);
        ctx.lineTo(V_WIDTH - zm, y);
        ctx.stroke();
      }

      if (zm > 0) {
        ctx.strokeStyle = '#320a0a';
        ctx.lineWidth = 2;
        ctx.strokeRect(zm, zm + 45, V_WIDTH - 2 * zm, V_HEIGHT - 2 * zm - 75);
      }

      trail.forEach(function(t) {
        if (t.alpha > 10) {
          ctx.beginPath();
          ctx.fillStyle = 'rgba(80, 200, 255, ' + (t.alpha / 255) + ')';
          ctx.arc(t.x, t.y, Math.max(1, 4 * (t.alpha / 200)), 0, Math.PI * 2);
          ctx.fill();
        }
      });

      if (STATE.shockwaveRing > 0 && STATE.shockwavePos) {
        ctx.save();
        ctx.beginPath();
        const a = Math.max(0, 1 - STATE.shockwaveRing / 220);
        ctx.strokeStyle = 'rgba(255, 220, 50, ' + a + ')';
        ctx.lineWidth = 4;
        ctx.arc(STATE.shockwavePos.x, STATE.shockwavePos.y, STATE.shockwaveRing, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Laser: Layer 1 (Telegraph guidance cone) + Layer 2 (850px blinding beam)
      if (STATE.laserActive > 0) {
        const BEAM_LEN = 850;
        const ex = STATE.px + Math.cos(STATE.laserAngle) * BEAM_LEN;
        const ey = STATE.py + Math.sin(STATE.laserAngle) * BEAM_LEN;

        // Layer 1: Telegraph glow aura
        ctx.strokeStyle = 'rgba(50, 255, 100, 0.22)';
        ctx.lineWidth = 26;
        ctx.beginPath();
        ctx.moveTo(STATE.px, STATE.py);
        ctx.lineTo(ex, ey);
        ctx.stroke();

        // Layer 2: Core cutting beam
        ctx.strokeStyle = '#aaffaa';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(STATE.px, STATE.py);
        ctx.lineTo(ex, ey);
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(STATE.px, STATE.py);
        ctx.lineTo(ex, ey);
        ctx.stroke();
      }

      // Plasma Orbiters: Layer 1 (energy trail) + Layer 2 (rotating sawblades)
      if (STATE.plasmaActive > 0) {
        const ORBIT_R = 68;
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 0, 170, 0.25)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(STATE.px, STATE.py, ORBIT_R, 0, Math.PI * 2);
        ctx.stroke();

        for (let i = 0; i < 3; i++) {
          const a = STATE.plasmaAngle + (i * Math.PI * 2 / 3);
          const bx = STATE.px + Math.cos(a) * ORBIT_R;
          const by = STATE.py + Math.sin(a) * ORBIT_R;

          ctx.fillStyle = '#ff00aa';
          ctx.beginPath();
          ctx.arc(bx, by, 7, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(bx, by, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Tesla Arcs: Layer 1 (electric branching bolts)
      if (STATE.teslaArcs && STATE.teslaArcs.length > 0) {
        ctx.save();
        STATE.teslaArcs.forEach(function(arc) {
          const alpha = arc.life / 18;
          ctx.strokeStyle = 'rgba(0, 229, 255, ' + alpha + ')';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(arc.x1, arc.y1);
          // Zigzag intermediate point
          const mx = (arc.x1 + arc.x2) / 2 + (Math.random() - 0.5) * 16;
          const my = (arc.y1 + arc.y2) / 2 + (Math.random() - 0.5) * 16;
          ctx.lineTo(mx, my);
          ctx.lineTo(arc.x2, arc.y2);
          ctx.stroke();
        });
        ctx.restore();
      }

      // Nuke: Layer 1 (expanding distortion shockwave) + Layer 2 (white blast flash)
      if (STATE.nukeRing > 0 && STATE.nukePos) {
        ctx.save();
        const a = Math.max(0, 1 - STATE.nukeRing / 550);
        ctx.strokeStyle = 'rgba(255, 68, 0, ' + a + ')';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(STATE.nukePos.x, STATE.nukePos.y, STATE.nukeRing, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 255, ' + (a * 0.8) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(STATE.nukePos.x, STATE.nukePos.y, STATE.nukeRing * 0.96, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      if (STATE.vortexActive > 0 && STATE.vortexPos) {
        const t = performance.now() / 250;
        ctx.fillStyle = '#b432ff';
        for (let i = 0; i < 4; i++) {
          const a = t + (i * Math.PI) / 2;
          const r = 25 + i * 16;
          ctx.beginPath();
          ctx.arc(STATE.vortexPos.x + Math.cos(a) * r, STATE.vortexPos.y + Math.sin(a) * r, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (STATE.shieldActive > 0) {
        const a = 0.35 * (STATE.shieldActive / 18);
        ctx.fillStyle = 'rgba(100, 200, 255, ' + (a * 0.4) + ')';
        ctx.beginPath();
        ctx.arc(STATE.px, STATE.py, SHIELD_R, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(100, 200, 255, ' + (a + 0.3) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(STATE.px, STATE.py, SHIELD_R, 0, Math.PI * 2);
        ctx.stroke();
      }

      enemies.forEach(function(e) {
        ctx.save();
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;
        if (e.flash > 0) e.flash--;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      powerups.forEach(function(p) {
        p.pulse += 0.08;
        const r = p.radius + Math.sin(p.pulse) * 2.5;
        const color = PU_COLORS[p.kind] || '#ffffff';
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        drawPowerupIcon(ctx, p.kind, p.x, p.y, r);
      });

      // Target reticle & faint tether (Zendoku offset + lerp target)
      if (STATE.touching && STATE.alive) {
        ctx.save();
        // Target destination ring
        ctx.strokeStyle = 'rgba(80, 200, 255, 0.45)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.arc(STATE.tx, STATE.ty, PR + 3, 0, Math.PI * 2);
        ctx.stroke();

        // Line connecting player orb to destination target
        ctx.strokeStyle = 'rgba(80, 200, 255, 0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(STATE.px, STATE.py);
        ctx.lineTo(STATE.tx, STATE.ty);
        ctx.stroke();

        // Finger touch point anchor
        if (rawTouchPos) {
          ctx.fillStyle = 'rgba(80, 200, 255, 0.35)';
          ctx.beginPath();
          ctx.arc(rawTouchPos.x, rawTouchPos.y, 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      if (false && STATE.touching && rawTouchPos && STATE.alive) {
        ctx.save();
        ctx.strokeStyle = 'rgba(80, 200, 255, 0.22)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(rawTouchPos.x, rawTouchPos.y);
        ctx.lineTo(STATE.px, STATE.py);
        ctx.stroke();

        ctx.fillStyle = 'rgba(80, 200, 255, 0.4)';
        ctx.beginPath();
        ctx.arc(rawTouchPos.x, rawTouchPos.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (STATE.alive) {
        ctx.save();
        ctx.shadowColor = '#2878c8';
        ctx.shadowBlur = 18;
        ctx.fillStyle = (STATE.invincibleFrames > 0 && (STATE.invincibleFrames % 4 < 2)) ? '#ffffff' : '#50c8ff';
        ctx.beginPath();
        ctx.arc(STATE.px, STATE.py, PR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#c8f0ff';
        ctx.beginPath();
        ctx.arc(STATE.px, STATE.py, PR * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      particles.forEach(function(p) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      ctx.fillStyle = '#c8c8dc';
      ctx.font = 'bold 16px -apple-system, Menlo, monospace';
      ctx.fillText('SCORE ' + Math.floor(STATE.score), 15, 25);

      ctx.fillStyle = '#9696aa';
      ctx.textAlign = 'right';
      ctx.fillText('WAVE ' + STATE.wave, V_WIDTH - 15, 25);
      ctx.textAlign = 'left';

      if (STATE.combo > 1) {
        ctx.fillStyle = '#ffdc32';
        ctx.textAlign = 'center';
        ctx.fillText('x' + STATE.combo + ' COMBO', V_WIDTH / 2, 25);
        ctx.textAlign = 'left';
      }

      const yb = V_HEIGHT - 12;
      ctx.font = '11px -apple-system, Menlo, monospace';
      ctx.fillStyle = STATE.dashCd <= 0 ? '#50c8ff' : '#46465a';
      ctx.fillText('^ SWIPE UP: DASH', 15, yb);

      ctx.textAlign = 'right';
      ctx.fillStyle = STATE.shieldCd <= 0 ? '#64c8ff' : '#46465a';
      ctx.fillText('v SWIPE DOWN: SHIELD', V_WIDTH - 15, yb);
      ctx.textAlign = 'left';

      if (STATE.iceSlowFrames > 0) {
        ctx.fillStyle = '#64dcff';
        ctx.textAlign = 'center';
        ctx.fillText('* FROZEN', V_WIDTH / 2, yb);
        ctx.textAlign = 'left';
      }

      if (STATE.alive && enemies.length === 0 && STATE.waveTimer > 0) {
        ctx.fillStyle = '#646482';
        ctx.font = '14px -apple-system, Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Wave ' + (STATE.wave + 1) + ' incoming...', V_WIDTH / 2, V_HEIGHT / 2 - 10);
        ctx.textAlign = 'left';
      }

      if (!STATE.alive) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff5050';
        ctx.font = 'bold 32px -apple-system, Menlo, monospace';
        ctx.fillText('GAME OVER', V_WIDTH / 2, V_HEIGHT / 2 - 50);

        ctx.fillStyle = '#c8c8dc';
        ctx.font = '18px -apple-system, Menlo, monospace';
        ctx.fillText('Score: ' + Math.floor(STATE.score), V_WIDTH / 2, V_HEIGHT / 2);

        ctx.fillStyle = '#ffdc32';
        ctx.fillText('Best: ' + STATE.highScore, V_WIDTH / 2, V_HEIGHT / 2 + 30);

        if (STATE.deathTimer > 0.4) {
          ctx.fillStyle = '#9696aa';
          ctx.font = '13px -apple-system, Menlo, monospace';
          ctx.fillText('tap anywhere to restart', V_WIDTH / 2, V_HEIGHT / 2 + 75);
        }
        ctx.textAlign = 'left';
      }

      ctx.restore();
    }

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
