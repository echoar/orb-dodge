<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orb Dodge">
  <meta name="theme-color" content="#080812">
  <title>Orb Dodge</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      background-color: #080812;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #error-box {
      display: none;
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(220, 20, 20, 0.95);
      color: white;
      padding: 10px;
      font-size: 11px;
      z-index: 9999;
      border-radius: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="error-box"></div>
  <canvas id="gameCanvas"></canvas>

  <script>
    // iOS Safari gesture prevention
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

    window.onerror = function(msg, url, line) {
      const box = document.getElementById('error-box');
      if (box) {
        box.style.display = 'block';
        box.innerText = 'Error: ' + msg + ' (L' + line + ')';
      }
      return false;
    };

    function getStoredHS() {
      try {
        return parseInt(localStorage.getItem('orb_dodge_hs') || '0', 10) || 0;
      } catch (e) {
        return 0;
      }
    }
    function saveHS(val) {
      try {
        localStorage.setItem('orb_dodge_hs', val);
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const V_WIDTH = 400;
    const V_HEIGHT = 711;

    let viewScale = 1.0;
    let canvasRect = { left: 0, top: 0, width: V_WIDTH, height: V_HEIGHT };

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

      viewScale = Math.min(w / V_WIDTH, h / V_HEIGHT);
      const displayW = Math.floor(V_WIDTH * viewScale);
      const displayH = Math.floor(V_HEIGHT * viewScale);

      canvas.style.width = displayW + 'px';
      canvas.style.height = displayH + 'px';
      canvas.width = Math.floor(displayW * dpr);
      canvas.height = Math.floor(displayH * dpr);

      canvasRect = canvas.getBoundingClientRect();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function() { setTimeout(resize, 200); });
    resize();

    const STATE = {
      px: V_WIDTH / 2,
      py: V_HEIGHT / 2,
      tx: V_WIDTH / 2,
      ty: V_HEIGHT / 2,
      touching: false,
      alive: true,
      score: 0,
      highScore: getStoredHS(),
      wave: 0,
      waveTimer: 1.0,
      powerupTimer: 4.0,
      combo: 0,
      comboTimer: 0,
      dashing: false,
      dashDir: { x: 0, y: -1 },
      dashFrames: 0,
      dashCd: 0,
      invincibleFrames: 0,
      shieldActive: 0,
      shieldCd: 0,
      zoneMargin: 0,
      shockwaveRing: 0,
      shockwavePos: null,
      vortexActive: 0,
      vortexPos: null,
      iceSlowFrames: 0,
      laserActive: 0,
      laserAngle: 0,
      deathTimer: 0
    };

    const PR = 14;
    const LERP = 10.0;
    const TRAIL_MAX = 55;
    const TRAIL_DMG = 1;
    const DASH_DIST = 130;
    const DASH_SPD = 26;
    const SHIELD_R = 105;

    let trail = [];
    let enemies = [];
    let powerups = [];
    let particles = [];

    const ENEMY_COLORS = ['#ff3c3c', '#ff6428', '#ff3250', '#dc2828'];
    const PU_COLORS = {
      shockwave: '#ffdc32',
      vortex: '#b432ff',
      ice_nova: '#64dcff',
      laser: '#32ff64'
    };

    function reset() {
      STATE.px = V_WIDTH / 2;
      STATE.py = V_HEIGHT / 2;
      STATE.tx = STATE.px;
      STATE.ty = STATE.py;
      STATE.touching = false;
      STATE.alive = true;
      STATE.score = 0;
      STATE.wave = 0;
      STATE.waveTimer = 1.0;
      STATE.powerupTimer = 4.0;
      STATE.combo = 0;
      STATE.comboTimer = 0;
      STATE.dashing = false;
      STATE.dashFrames = 0;
      STATE.dashCd = 0;
      STATE.invincibleFrames = 0;
      STATE.shieldActive = 0;
      STATE.shieldCd = 0;
      STATE.zoneMargin = 0;
      STATE.shockwaveRing = 0;
      STATE.shockwavePos = null;
      STATE.vortexActive = 0;
      STATE.vortexPos = null;
      STATE.iceSlowFrames = 0;
      STATE.laserActive = 0;
      STATE.deathTimer = 0;

      trail = [];
      enemies = [];
      powerups = [];
      particles = [];
    }

    function spawnWave() {
      STATE.wave++;
      const count = 5 + STATE.wave * 2;
      const speed = 1.2 + STATE.wave * 0.025;
      STATE.zoneMargin = Math.min(55, STATE.wave * 3.5);

      for (let i = 0; i < count; i++) {
        const side = Math.floor(Math.random() * 4);
        let x, y;
        const M = 30;
        if (side === 0) { x = Math.random() * V_WIDTH; y = -M; }
        else if (side === 1) { x = Math.random() * V_WIDTH; y = V_HEIGHT + M; }
        else if (side === 2) { x = -M; y = Math.random() * V_HEIGHT; }
        else { x = V_WIDTH + M; y = Math.random() * V_HEIGHT; }

        enemies.push({
          x, y,
          speed: speed * (0.75 + Math.random() * 0.5),
          radius: 10,
          hp: 1,
          color: ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)],
          flash: 0
        });
      }
    }

    function spawnPowerup() {
      const m = STATE.zoneMargin + 40;
      const kinds = Object.keys(PU_COLORS);
      powerups.push({
        x: m + Math.random() * (V_WIDTH - 2 * m),
        y: m + 50 + Math.random() * (V_HEIGHT - 2 * m - 80),
        kind: kinds[Math.floor(Math.random() * kinds.length)],
        radius: 12,
        pulse: Math.random() * Math.PI
      });
    }

    function spawnParticles(x, y, color, count, speed) {
      count = count || 12;
      speed = speed || 4;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * speed;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 15 + Math.random() * 20,
          maxLife: 35,
          color,
          radius: 2 + Math.random() * 3
        });
      }
    }

    function activatePowerup(kind) {
      STATE.combo++;
      STATE.comboTimer = 2.2;
      const mul = Math.min(STATE.combo, 3.5);

      if (kind === 'shockwave') {
        STATE.shockwaveRing = 1;
        STATE.shockwavePos = { x: STATE.px, y: STATE.py };
        const r = 125 * mul;
        enemies = enemies.filter(function(e) {
          const d = Math.hypot(e.x - STATE.px, e.y - STATE.py);
          if (d < r) {
            spawnParticles(e.x, e.y, e.color, 8);
            STATE.score += 10;
            return false;
          }
          return true;
        });
        spawnParticles(STATE.px, STATE.py, '#ffdc32', 24, 7);
      } else if (kind === 'vortex') {
        STATE.vortexActive = 95 * mul;
        STATE.vortexPos = { x: STATE.px, y: STATE.py };
      } else if (kind === 'ice_nova') {
        STATE.iceSlowFrames = 130 * mul;
        spawnParticles(STATE.px, STATE.py, '#64dcff', 24, 6);
        enemies.forEach(function(e) { e.speed *= 0.35; });
      } else if (kind === 'laser') {
        STATE.laserActive = 65 * mul;
        STATE.laserAngle = STATE.touching ? Math.atan2(STATE.ty - STATE.py, STATE.tx - STATE.px) : 0;
        spawnParticles(STATE.px, STATE.py, '#32ff64', 18, 8);
      }
    }

    let swipeStart = null;
    let swipeStartTime = 0;

    function getTouchCoords(clientX, clientY) {
      canvasRect = canvas.getBoundingClientRect();
      const x = ((clientX - canvasRect.left) / canvasRect.width) * V_WIDTH;
      const y = ((clientY - canvasRect.top) / canvasRect.height) * V_HEIGHT;
      return {
        x: Math.max(0, Math.min(V_WIDTH, x)),
        y: Math.max(0, Math.min(V_HEIGHT, y))
      };
    }

    function onStart(cx, cy) {
      const pt = getTouchCoords(cx, cy);
      if (!STATE.alive && STATE.deathTimer > 0.4) {
        reset();
        return;
      }
      STATE.touching = true;
      STATE.tx = pt.x;
      STATE.ty = pt.y;
      swipeStart = pt;
      swipeStartTime = performance.now();
    }

    function onMove(cx, cy) {
      if (!STATE.touching) return;
      const pt = getTouchCoords(cx, cy);
      STATE.tx = pt.x;
      STATE.ty = pt.y;
    }

    function onEnd(cx, cy) {
      if (!STATE.touching) return;
      STATE.touching = false;
      const endPt = getTouchCoords(cx, cy);

      if (swipeStart) {
        const dx = endPt.x - swipeStart.x;
        const dy = endPt.y - swipeStart.y;
        const dist = Math.hypot(dx, dy);
        const elapsed = performance.now() - swipeStartTime;

        if (dist > 35 && elapsed < 350) {
          if (dy < -25 && Math.abs(dx) < Math.abs(dy) * 1.5 && STATE.dashCd <= 0) {
            const n = Math.hypot(dx, dy) || 1;
            STATE.dashDir = { x: dx / n, y: dy / n };
            STATE.dashing = true;
            STATE.dashFrames = Math.floor(DASH_DIST / DASH_SPD);
            STATE.dashCd = 1.4;
            STATE.invincibleFrames = 12;
            spawnParticles(STATE.px, STATE.py, '#50c8ff', 12, 4);
          } else if (dy > 25 && Math.abs(dx) < Math.abs(dy) * 1.5 && STATE.shieldCd <= 0) {
            STATE.shieldActive = 18;
            STATE.shieldCd = 2.8;
            spawnParticles(STATE.px, STATE.py, '#64c8ff', 16, 5);
            enemies.forEach(function(en) {
              const d = Math.hypot(en.x - STATE.px, en.y - STATE.py);
              if (d < SHIELD_R && d > 1) {
                en.x += ((en.x - STATE.px) / d) * 10;
                en.y += ((en.y - STATE.py) / d) * 10;
              }
            });
          }
        }
      }
      swipeStart = null;
    }

    // Touch event listeners
    window.addEventListener('touchstart', function(e) {
      e.preventDefault();
      if (e.touches.length > 0) onStart(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (e.touches.length > 0) onMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchend', function(e) {
      e.preventDefault();
      if (e.changedTouches.length > 0) onEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      else onEnd(STATE.tx, STATE.ty);
    }, { passive: false });

    // Mouse listeners for desktop testing
    window.addEventListener('mousedown', function(e) { onStart(e.clientX, e.clientY); });
    window.addEventListener('mousemove', function(e) { onMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', function(e) { onEnd(e.clientX, e.clientY); });

    let lastTime = performance.now();

    function update(dt) {
      if (!STATE.alive) {
        STATE.deathTimer += dt;
        return;
      }

      if (STATE.dashing) {
        STATE.px += STATE.dashDir.x * DASH_SPD;
        STATE.py += STATE.dashDir.y * DASH_SPD;
        STATE.dashFrames--;
        if (STATE.dashFrames <= 0) STATE.dashing = false;
      } else if (STATE.touching) {
        STATE.px += (STATE.tx - STATE.px) * Math.min(1.0, LERP * dt);
        STATE.py += (STATE.ty - STATE.py) * Math.min(1.0, LERP * dt);
      }

      const zm = STATE.zoneMargin;
      STATE.px = Math.max(zm + PR, Math.min(V_WIDTH - zm - PR, STATE.px));
      STATE.py = Math.max(zm + PR + 45, Math.min(V_HEIGHT - zm - PR - 30, STATE.py));

      if (STATE.dashCd > 0) STATE.dashCd -= dt;
      if (STATE.shieldCd > 0) STATE.shieldCd -= dt;
      if (STATE.invincibleFrames > 0) STATE.invincibleFrames--;
      if (STATE.shieldActive > 0) STATE.shieldActive--;
      if (STATE.comboTimer > 0) STATE.comboTimer -= dt;
      else STATE.combo = 0;

      trail.push({ x: STATE.px, y: STATE.py, alpha: 200 });
      if (trail.length > TRAIL_MAX) trail.shift();
      trail.forEach(function(t) { t.alpha -= 3.5; });
      trail = trail.filter(function(t) { return t.alpha > 0; });

      const iceFactor = STATE.iceSlowFrames > 0 ? 0.35 : 1.0;
      if (STATE.iceSlowFrames > 0) {
        STATE.iceSlowFrames--;
        if (STATE.iceSlowFrames === 0) enemies.forEach(function(e) { e.speed /= 0.35; });
      }

      enemies.forEach(function(e) {
        if (STATE.vortexActive > 0 && STATE.vortexPos) {
          const vdx = STATE.vortexPos.x - e.x;
          const vdy = STATE.vortexPos.y - e.y;
          const vd = Math.hypot(vdx, vdy);
          if (vd < 155 && vd > 1) {
            e.x += (vdx / vd) * 3.2;
            e.y += (vdy / vd) * 3.2;
            if (vd < 20) {
              spawnParticles(e.x, e.y, e.color, 5);
              e.hp = 0;
              STATE.score += 10;
            }
          }
        }

        const dx = STATE.px - e.x;
        const dy = STATE.py - e.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 1) {
          e.x += (dx / dist) * e.speed * dt * 60 * iceFactor;
          e.y += (dy / dist) * e.speed * dt * 60 * iceFactor;
        }

        for (let i = 0; i < trail.length; i++) {
          const t = trail[i];
          if (t.alpha > 45 && Math.hypot(t.x - e.x, t.y - e.y) < e.radius + 5) {
            e.hp -= TRAIL_DMG;
            e.flash = 4;
            t.alpha = 0;
            break;
          }
        }

        if (STATE.invincibleFrames <= 0 && STATE.shieldActive <= 0) {
          if (dist < PR + e.radius - 2) {
            STATE.alive = false;
            if (STATE.score > STATE.highScore) {
              STATE.highScore = Math.floor(STATE.score);
              saveHS(STATE.highScore);
            }
            spawnParticles(STATE.px, STATE.py, '#50c8ff', 35, 9);
          }
        }
      });

      if (STATE.vortexActive > 0) STATE.vortexActive--;

      if (STATE.laserActive > 0) {
        STATE.laserAngle += 0.08;
        STATE.laserActive--;
        enemies.forEach(function(e) {
          const ea = Math.atan2(e.y - STATE.py, e.x - STATE.px);
          const ad = Math.abs((ea - STATE.laserAngle + Math.PI) % (Math.PI * 2) - Math.PI);
          if (ad < 0.16 && Math.hypot(e.x - STATE.px, e.y - STATE.py) < 260) {
            e.hp = 0;
            spawnParticles(e.x, e.y, '#32ff64', 6);
            STATE.score += 10;
          }
        });
      }

      enemies = enemies.filter(function(e) { return e.hp > 0; });

      STATE.powerupTimer -= dt;
      if (STATE.powerupTimer <= 0) {
        spawnPowerup();
        STATE.powerupTimer = 4.8;
      }
      powerups = powerups.filter(function(p) {
        if (Math.hypot(p.x - STATE.px, p.y - STATE.py) < PR + p.radius) {
          activatePowerup(p.kind);
          return false;
        }
        return true;
      });

      if (enemies.length === 0) {
        STATE.waveTimer -= dt;
        if (STATE.waveTimer <= 0) {
          spawnWave();
          STATE.waveTimer = 2.0;
        }
      }

      if (STATE.shockwaveRing > 0) {
        STATE.shockwaveRing += 8;
        if (STATE.shockwaveRing > 220) STATE.shockwaveRing = 0;
      }

      particles.forEach(function(p) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life--;
        p.radius *= 0.97;
      });
      particles = particles.filter(function(p) { return p.life > 0 && p.radius > 0.4; });

      STATE.score += dt * 3;
    }

    function draw() {
      const scale = (canvas.width / V_WIDTH);

      ctx.save();
      ctx.setTransform(scale, 0, 0, scale, 0, 0);

      ctx.fillStyle = '#080812';
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      const zm = STATE.zoneMargin;
      ctx.strokeStyle = '#121223';
      ctx.lineWidth = 1;
      for (let x = zm; x < V_WIDTH - zm; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, zm + 45);
        ctx.lineTo(x, V_HEIGHT - zm - 30);
        ctx.stroke();
      }
      for (let y = zm + 45; y < V_HEIGHT - zm - 30; y += 30) {
        ctx.beginPath();
        ctx.moveTo(zm, y);
        ctx.lineTo(V_WIDTH - zm, y);
        ctx.stroke();
      }

      if (zm > 0) {
        ctx.strokeStyle = '#320a0a';
        ctx.lineWidth = 2;
        ctx.strokeRect(zm, zm + 45, V_WIDTH - 2 * zm, V_HEIGHT - 2 * zm - 75);
      }

      trail.forEach(function(t) {
        if (t.alpha > 10) {
          ctx.beginPath();
          ctx.fillStyle = 'rgba(80, 200, 255, ' + (t.alpha / 255) + ')';
          ctx.arc(t.x, t.y, Math.max(1, 4 * (t.alpha / 200)), 0, Math.PI * 2);
          ctx.fill();
        }
      });

      if (STATE.shockwaveRing > 0 && STATE.shockwavePos) {
        ctx.save();
        ctx.beginPath();
        const a = Math.max(0, 1 - STATE.shockwaveRing / 220);
        ctx.strokeStyle = 'rgba(255, 220, 50, ' + a + ')';
        ctx.lineWidth = 4;
        ctx.arc(STATE.shockwavePos.x, STATE.shockwavePos.y, STATE.shockwaveRing, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      if (STATE.laserActive > 0) {
        const ex = STATE.px + Math.cos(STATE.laserAngle) * 320;
        const ey = STATE.py + Math.sin(STATE.laserAngle) * 320;

        ctx.strokeStyle = 'rgba(50, 255, 100, 0.25)';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.moveTo(STATE.px, STATE.py);
        ctx.lineTo(ex, ey);
        ctx.stroke();

        ctx.strokeStyle = '#32ff64';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(STATE.px, STATE.py);
        ctx.lineTo(ex, ey);
        ctx.stroke();
      }

      if (STATE.vortexActive > 0 && STATE.vortexPos) {
        const t = performance.now() / 250;
        ctx.fillStyle = '#b432ff';
        for (let i = 0; i < 4; i++) {
          const a = t + (i * Math.PI) / 2;
          const r = 25 + i * 16;
          ctx.beginPath();
          ctx.arc(STATE.vortexPos.x + Math.cos(a) * r, STATE.vortexPos.y + Math.sin(a) * r, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (STATE.shieldActive > 0) {
        const a = 0.35 * (STATE.shieldActive / 18);
        ctx.fillStyle = 'rgba(100, 200, 255, ' + (a * 0.4) + ')';
        ctx.beginPath();
        ctx.arc(STATE.px, STATE.py, SHIELD_R, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(100, 200, 255, ' + (a + 0.3) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(STATE.px, STATE.py, SHIELD_R, 0, Math.PI * 2);
        ctx.stroke();
      }

      enemies.forEach(function(e) {
        ctx.save();
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;
        if (e.flash > 0) e.flash--;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      powerups.forEach(function(p) {
        p.pulse += 0.08;
        const r = p.radius + Math.sin(p.pulse) * 2.5;
        const color = PU_COLORS[p.kind] || '#ffffff';
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 0.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });

      if (STATE.alive) {
        ctx.save();
        ctx.shadowColor = '#2878c8';
        ctx.shadowBlur = 18;
        ctx.fillStyle = (STATE.invincibleFrames > 0 && (STATE.invincibleFrames % 4 < 2)) ? '#ffffff' : '#50c8ff';
        ctx.beginPath();
        ctx.arc(STATE.px, STATE.py, PR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#c8f0ff';
        ctx.beginPath();
        ctx.arc(STATE.px, STATE.py, PR * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      particles.forEach(function(p) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      ctx.fillStyle = '#c8c8dc';
      ctx.font = 'bold 16px -apple-system, Menlo, monospace';
      ctx.fillText('SCORE ' + Math.floor(STATE.score), 15, 25);

      ctx.fillStyle = '#9696aa';
      ctx.textAlign = 'right';
      ctx.fillText('WAVE ' + STATE.wave, V_WIDTH - 15, 25);
      ctx.textAlign = 'left';

      if (STATE.combo > 1) {
        ctx.fillStyle = '#ffdc32';
        ctx.textAlign = 'center';
        ctx.fillText('x' + STATE.combo + ' COMBO', V_WIDTH / 2, 25);
        ctx.textAlign = 'left';
      }

      const yb = V_HEIGHT - 12;
      ctx.font = '11px -apple-system, Menlo, monospace';
      ctx.fillStyle = STATE.dashCd <= 0 ? '#50c8ff' : '#46465a';
      ctx.fillText('^ SWIPE UP: DASH', 15, yb);

      ctx.textAlign = 'right';
      ctx.fillStyle = STATE.shieldCd <= 0 ? '#64c8ff' : '#46465a';
      ctx.fillText('v SWIPE DOWN: SHIELD', V_WIDTH - 15, yb);
      ctx.textAlign = 'left';

      if (STATE.iceSlowFrames > 0) {
        ctx.fillStyle = '#64dcff';
        ctx.textAlign = 'center';
        ctx.fillText('* FROZEN', V_WIDTH / 2, yb);
        ctx.textAlign = 'left';
      }

      if (STATE.alive && enemies.length === 0 && STATE.waveTimer > 0) {
        ctx.fillStyle = '#646482';
        ctx.font = '14px -apple-system, Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Wave ' + (STATE.wave + 1) + ' incoming...', V_WIDTH / 2, V_HEIGHT / 2 - 10);
        ctx.textAlign = 'left';
      }

      if (!STATE.alive) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff5050';
        ctx.font = 'bold 32px -apple-system, Menlo, monospace';
        ctx.fillText('GAME OVER', V_WIDTH / 2, V_HEIGHT / 2 - 50);

        ctx.fillStyle = '#c8c8dc';
        ctx.font = '18px -apple-system, Menlo, monospace';
        ctx.fillText('Score: ' + Math.floor(STATE.score), V_WIDTH / 2, V_HEIGHT / 2);

        ctx.fillStyle = '#ffdc32';
        ctx.fillText('Best: ' + STATE.highScore, V_WIDTH / 2, V_HEIGHT / 2 + 30);

        if (STATE.deathTimer > 0.4) {
          ctx.fillStyle = '#9696aa';
          ctx.font = '13px -apple-system, Menlo, monospace';
          ctx.fillText('tap anywhere to restart', V_WIDTH / 2, V_HEIGHT / 2 + 75);
        }
        ctx.textAlign = 'left';
      }

      ctx.restore();
    }

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
